name: Déploiement GitHub Pages

on:
  push:
    branches:
      - main
      - claude/civic-exam-training-platform-794c2u
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verifier:
    name: Contrôles avant publication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Le site publié est public : aucun secret ne doit y figurer.
      - name: Recherche de secrets
        run: node scripts/check-secrets.mjs
      - name: Contrôle d'intégrité de la banque
        run: node scripts/check-bank.mjs
      - name: Cohérence de la traduction arabe
        run: node scripts/check-traduction.mjs
      - name: Syntaxe des workflows
        run: node scripts/check-workflows.mjs
      - name: Respect du système de design
        run: node scripts/check-design.mjs
      - name: Date de publication et journal des versions
        run: node scripts/check-version.mjs

  deployer:
    name: Publication
    needs: verifier
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Historique complet : la date de chaque contenu se lit dans les commits
      # qui l'ont touché. Un clone superficiel n'en contient qu'un seul et
      # laisserait toutes ces dates vides.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Le site publié porte la date du commit d'où il sort, calculée ici et
      # jamais saisie à la main.
      - name: Dater la publication
        run: node scripts/make-version.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
