<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Examen civique — Entraînement naturalisation</title>
<meta name="description" content="Application gratuite d'entraînement au QCM de l'examen civique pour la naturalisation française : examens blancs de 40 questions, révision espacée, fiches de cours et suivi de progression.">
<link rel="canonical" href="https://sabir-art.github.io/Examen-civique-naturalisation/">
<!-- Aperçu de partage. Sans ces balises, le lien envoyé dans une conversation
     n'affiche qu'une adresse grise : ni titre, ni image, ni phrase — et
     personne n'ouvre une application dont il ne voit rien. L'image est
     fabriquée par scripts/make-partage.mjs, aux couleurs de l'application. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Examen civique">
<meta property="og:locale" content="fr_FR">
<meta property="og:url" content="https://sabir-art.github.io/Examen-civique-naturalisation/">
<meta property="og:title" content="L'examen civique, en s'entraînant">
<meta property="og:description" content="735 questions, des examens blancs en conditions réelles, le livret du citoyen et l'histoire de France racontée. Gratuit, sans publicité, hors ligne.">
<meta property="og:image" content="https://sabir-art.github.io/Examen-civique-naturalisation/assets/og/partage.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Écran de révision de l'application : les thèmes du programme et leur avancement.">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#E9F1EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101312" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Examen civique">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
<!-- Deux feuilles, chargées en parallèle : la couche de jetons du système de
     design, puis la feuille de l'application qui s'y branche. Les polices
     sont préchargées — sans cela le premier rendu se fait dans la police de
     secours, et tout le texte saute quand la vraie arrive. -->
<link rel="preload" as="font" type="font/woff2" href="./assets/fonts/plus-jakarta-sans-latin.woff2" crossorigin>
<link rel="stylesheet" href="./assets/css/civica.css">
<link rel="stylesheet" href="./assets/css/civica-components.css">
<link rel="stylesheet" href="./assets/css/app.css">
</head>
<body>

<!-- Écran d'ouverture. Il est écrit en dur dans la page, et non construit par
     JavaScript : il doit s'afficher au premier rendu, avant même que les modules
     soient chargés. C'est ce qui marque le début d'une session — sans lui, on ne
     sait pas si l'application vient d'être ouverte ou n'a jamais été fermée. -->
<div id="boot" class="boot" role="status" aria-live="polite">
  <div class="boot__inner">
    <svg class="boot__mark" viewBox="0 0 120 120" aria-hidden="true">
      <circle class="boot__ring boot__ring--b" cx="60" cy="60" r="50" />
      <circle class="boot__ring boot__ring--w" cx="60" cy="60" r="34" />
      <circle class="boot__ring boot__ring--r" cx="60" cy="60" r="18" />
      <path class="boot__spark" d="M60 44v32M44 60h32" />
    </svg>
    <p class="boot__name">Examen civique</p>
    <p class="boot__text" id="boot-text">Préparation à la naturalisation</p>
    <span class="boot__load" aria-hidden="true"><i></i></span>
  </div>
  <noscript><p class="boot__text">Cette application nécessite JavaScript.</p></noscript>
</div>

<!-- Barre du haut et barre d'onglets : construites par `js/ds/navigation.js`
     à partir des composants TopBar et BottomNav du système de design, puis
     posées ici au démarrage. Elles restent dans la page (et non dans la vue)
     parce qu'elles survivent aux changements d'écran. -->
<div id="chrome-top"></div>

<main id="app" class="app" tabindex="-1" hidden></main>

<div id="chrome-bottom"></div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modal-root"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
