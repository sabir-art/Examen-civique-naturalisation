<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Examen civique — Entraînement naturalisation</title>
<meta name="description" content="Application gratuite d'entraînement au QCM de l'examen civique pour la naturalisation française : examens blancs de 40 questions, révision espacée, fiches de cours et suivi de progression.">
<meta name="theme-color" content="#E9F1EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101312" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Examen civique">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
<!-- Deux feuilles, chargées en parallèle : la couche de jetons du système de
     design, puis la feuille de l'application qui s'y branche. Les polices
     sont préchargées — sans cela le premier rendu se fait dans la police de
     secours, et tout le texte saute quand la vraie arrive. -->
<link rel="preload" as="font" type="font/woff2" href="./assets/fonts/plus-jakarta-sans-latin.woff2" crossorigin>
<link rel="stylesheet" href="./assets/css/civica.css">
<link rel="stylesheet" href="./assets/css/app.css">
</head>
<body>

<!-- Écran d'ouverture. Il est écrit en dur dans la page, et non construit par
     JavaScript : il doit s'afficher au premier rendu, avant même que les modules
     soient chargés. C'est ce qui marque le début d'une session — sans lui, on ne
     sait pas si l'application vient d'être ouverte ou n'a jamais été fermée. -->
<div id="boot" class="boot" role="status" aria-live="polite">
  <div class="boot__inner">
    <svg class="boot__mark" viewBox="0 0 120 120" aria-hidden="true">
      <circle class="boot__ring boot__ring--b" cx="60" cy="60" r="50" />
      <circle class="boot__ring boot__ring--w" cx="60" cy="60" r="34" />
      <circle class="boot__ring boot__ring--r" cx="60" cy="60" r="18" />
      <path class="boot__spark" d="M60 44v32M44 60h32" />
    </svg>
    <p class="boot__name">Examen civique</p>
    <p class="boot__text" id="boot-text">Préparation à la naturalisation</p>
    <span class="boot__load" aria-hidden="true"><i></i></span>
  </div>
  <noscript><p class="boot__text">Cette application nécessite JavaScript.</p></noscript>
</div>

<header class="appbar" id="appbar" hidden>
  <button class="appbar__back" id="appbar-back" type="button" aria-label="Retour" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
  </button>
  <h1 class="appbar__title" id="appbar-title">Examen civique</h1>
  <button class="appbar__action" id="appbar-search" type="button" aria-label="Rechercher">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.34-4.34" /><circle cx="11" cy="11" r="8" /></svg>
  </button>
  <button class="appbar__action" id="appbar-bell" type="button" aria-label="Activité">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0" /><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326" /></svg>
    <span class="dot" id="appbar-dot" hidden></span>
  </button>
  <button class="appbar__action" id="appbar-profile" type="button" aria-label="Mon compte">
    <span class="avatar" id="appbar-avatar">?</span>
  </button>
</header>

<main id="app" class="app" tabindex="-1" hidden></main>

<!-- Cinq onglets, jamais plus : au-delà, les cibles tactiles deviennent trop
     petites sur un petit téléphone. Les fiches et le livret sont accessibles
     depuis Réviser et depuis l'accueil. -->
<nav class="tabbar" id="tabbar" hidden aria-label="Navigation principale">
  <a class="tab" href="#/" data-tab="/">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" /><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg>
    <span>Accueil</span>
  </a>
  <a class="tab tab--story" href="#/histoire" data-tab="/histoire">

    <span>Réviser</span>
  </a>
  <a class="tab tab--accent" href="#/examen" data-tab="/examen">

    <span>Progrès</span>
  </a>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modal-root"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
